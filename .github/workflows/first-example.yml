name: My First Workflow 

on: push

jobs:
   first_job:
       runs-on: ubuntu-latest
       steps: 
       - name : Checkout Code
         uses : actions/checkout@v4

       - name : Run a one-line script
         run : echo "Hello World"

       - name : Run a multi-line script 
         run : |
            echo "Hello World"
            echo "Welcome to Github Actions"

       - name : Run a multi-line script with error
         run : |
            echo "Hello World"
            echo "Welcome to Github Actions"
            exit 1
          
       - name : List files 
         run : ls 
      
       - name : Read a file 
         run : cat README.md
